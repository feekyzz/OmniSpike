# Experiment 1:
# SNN backbone + SNN neck, but use a standard closed-set Detect head.
# This isolates whether the main problem is open-vocabulary text alignment or the SNN visual features themselves.
nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.33, 0.375, 1024]
  s: [0.33, 0.5, 1024]
  m: [0.5, 0.625, 1024]
  l: [0.5, 0.75, 1024]

backbone:
  - [-1, 1, MS_GetT, [3, 1]]
  - [-1, 1, MS_DownSampling, [128, 7, 4, 2, True]]
  - [-1, 3, MS_AllConvBlock, [4, 7]]
  - [-1, 1, MS_DownSampling, [256, 3, 2, 1, False]]
  - [-1, 6, MS_AllConvBlock, [4, 7]]
  - [-1, 1, MS_DownSampling, [512, 3, 2, 1, False]]
  - [-1, 9, MS_ConvBlock, [3, 7]]
  - [-1, 1, MS_DownSampling, [1024, 3, 2, 1, False]]
  - [-1, 3, MS_ConvBlock, [2, 7]]
  - [-1, 1, SpikeSPPF, [1024, 5]]

head:
  - [-1, 1, MS_StandardConv, [512, 1, 1]]
  - [-1, 1, nn.Upsample, [None, "(1,2,2)", "nearest"]]
  - [-1, 1, MS_ConvBlock, [3, 7]]
  - [[-1, 6], 1, Concat, [2]]

  - [-1, 1, MS_StandardConv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, "(1,2,2)", "nearest"]]
  - [-1, 1, MS_AllConvBlock, [4, 7]]
  - [[-1, 4], 1, Concat, [2]]
  - [-1, 1, MS_StandardConv, [256, 1, 1]]
  - [-1, 1, MS_AllConvBlock, [4, 7]]

  - [-1, 1, MS_StandardConv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [2]]
  - [-1, 1, MS_ConvBlock, [3, 7]]

  - [-1, 1, MS_StandardConv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [2]]
  - [-1, 1, MS_ConvBlock, [1, 7]]

  # Convert the final three SNN feature maps to ANN BCHW only right before the ordinary Detect head.
  - [19, 1, MS_CancelT, [1]]
  - [22, 1, MS_CancelT, [1]]
  - [25, 1, MS_CancelT, [1]]

  - [[26, 27, 28], 1, Detect, [nc]]
